<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Video Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
        }

        /* Header */

        .header {
            padding: 25px 6%;
            background: #171a23;
            border-bottom: 1px solid #292d38;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
        }

        /* Main */

        .container {
            width: 88%;
            max-width: 1400px;
            margin: 45px auto;
        }

        .container h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            color: #9ca3af;
            margin-bottom: 35px;
        }

        /* Video Grid */

        .video-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 25px;
        }

        /* Video Card */

        .video-card {
            background: #181b24;

            border-radius: 14px;

            overflow: hidden;

            border: 1px solid #292d38;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);

            border-color: #555b6b;
        }

        /* Video */

        .video-card video {
            width: 100%;

            display: block;

            background: black;

            aspect-ratio: 16 / 9;
        }

        /* Video Information */

        .video-info {
            padding: 18px;
        }

        .video-info h2 {
            font-size: 18px;

            margin-bottom: 7px;
        }

        .video-info p {
            color: #9ca3af;

            font-size: 14px;
        }

        /* Footer */

        footer {
            text-align: center;

            padding: 30px;

            margin-top: 50px;

            color: #777;

            border-top: 1px solid #292d38;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .header {
                flex-direction: column;

                align-items: flex-start;

                gap: 8px;
            }

            .container {
                width: 94%;

                margin-top: 30px;
            }

            .container h1 {
                font-size: 26px;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            🎬 My Video Library
        </div>

        <div class="subtitle">
            Watch your videos anytime
        </div>

    </header>



    <!-- MAIN CONTENT -->

    <main class="container">

        <h1>Video Collection</h1>

        <p class="description">
            Select a video below to start watching.
        </p>



        <!-- VIDEO GRID -->

        <section class="video-grid">


            <!-- VIDEO 1 -->

            <div class="video-card">

              <video controls width="100%" height="300">
    <source src="./videos/video1.mp4" type="video/mp4">
    Your browser does not support video playback.
</video>

                <div class="video-info">

                    <h2>Video 1</h2>

                    <p>
                        First video in the collection
                    </p>

                </div>

            </div>



            <!-- VIDEO 2 -->

            <div class="video-card">

                <video controls preload="metadata">

                    <source
                        src="videos/video2.mp4"
                        type="video/mp4">

                    Your browser does not support
                    video playback.

                </video>

                <div class="video-info">

                    <h2>Video 2</h2>

                    <p>
                        Second video in the collection
                    </p>

                </div>

            </div>



            <!-- VIDEO 3 -->

            <div class="video-card">

                <video controls preload="metadata">

                    <source
                        src="videos/video3.mp4"
                        type="video/mp4">

                    Your browser does not support
                    video playback.

                </video>

                <div class="video-info">

                    <h2>Video 3</h2>

                    <p>
                        Third video in the collection
                    </p>

                </div>

            </div>


        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 My Video Library
        </p>

    </footer>


</body>

</html>
